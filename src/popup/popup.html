<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearline</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Hearline</h1>
    <span class="sub">Any page, read aloud.</span>
  </header>

  <p id="msg" class="msg" hidden></p>

  <main id="main">
    <button id="read-page" class="primary">▶ Read this page</button>
    <button id="read-sel" class="secondary">Read selected text</button>

    <label class="row">
      <span>Speed <b id="rate-val">1×</b></span>
      <input id="rate" type="range" min="0.5" max="4" step="0.05">
    </label>

    <label class="row">
      <span>Voice</span>
      <select id="voice"></select>
    </label>
    <p id="voice-note" class="note" hidden></p>
  </main>

  <footer>
    <a href="#" id="settings">Settings</a>
    <span class="kbd">Alt + H</span>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="../shared/lang.js"></script>
  <script src="../shared/voices.js"></script>
  <script src="../shared/kokoro-voices.js"></script>
  <script src="popup.js"></script>
</body>
</html>
